# Throwaway test workflow (fork only, branch hil/lowpower-tinyusb-test): builds the
# Adafruit TinyUSB host/device + LowPower test sketches against stock 6.4.0 and the fixes.
name: HIL LowPower TinyUSB builds

on:
  push:
    branches: [hil/lowpower-tinyusb-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Init pico-sdk submodules
      run: |
        cd pico-sdk
        git submodule update --init
    - name: Get toolchain
      run: |
        cd tools
        python3 get.py
    - uses: arduino/setup-arduino-cli@v2
    - name: Link core into sketchbook
      run: |
        mkdir -p ~/Arduino/hardware/pico
        ln -s "$GITHUB_WORKSPACE" ~/Arduino/hardware/pico/rp2040
        arduino-cli core list
        arduino-cli board listall | grep -i -E "rpipico2w|rpipico\b" | head
        arduino-cli lib install "Pico PIO USB"
    - name: Build matrix
      run: |
        set -u
        STOCK=4a79653   # tag 6.4.0
        mkdir -p out
        : > out/summary.txt
        build() {
          local name=$1 fqbn=$2 sketch=$3 expect=$4
          local bp=/tmp/build-$name
          mkdir -p out/$name
          set +e
          arduino-cli compile --fqbn "$fqbn" --build-path "$bp" \
            --build-property "compiler.c.extra_flags=-Wall -Wextra" \
            --build-property "compiler.cpp.extra_flags=-Wall -Wextra" \
            "$sketch" > out/$name/build.log 2>&1
          local rc=$?
          set -e
          cp "$bp"/*.elf "$bp"/*.uf2 "$bp"/*.map out/$name/ 2>/dev/null || true
          local dup=$(grep -c "multiple definition" out/$name/build.log || true)
          local pulled="-"
          if ls "$bp"/*.map >/dev/null 2>&1; then
            pulled=$(grep -oE "libpico\.a\((usbd|tusb|tusb_fifo|cdc_device)\.c\.o\)" "$bp"/*.map | sort -u | tr '\n' ' ')
            [ -n "$pulled" ] || pulled="none"
          fi
          echo "$name rc=$rc expect=$expect multiple_definition=$dup libpico_tinyusb_members=[$pulled]" | tee -a out/summary.txt
          grep -n -E "(LowPower|main)\.cpp:[0-9]+:[0-9]+: warning" out/$name/build.log | tee -a out/summary.txt || true
          if [ -f "$bp"/*.map ]; then
            grep -n -B1 -A1 -E "^ *tud_inited|^ *tud_deinit|^ *tud_rhport_init|\(tud_inited\)|\(tud_cdc_n_write_flush\)" "$bp"/*.map | head -20 > out/$name/tud_symbols.txt || true
          fi
          tail -25 out/$name/build.log
        }
        HP=pico:rp2040:rpipico2w:usbstack=tinyusb_host
        DV=pico:rp2040:rpipico2w:usbstack=tinyusb
        HP2040=pico:rp2040:rpipico:usbstack=tinyusb_host
        S=tests/hil-lowpower

        # 1. stock 6.4.0 core + LowPower
        git checkout $STOCK -- cores/rp2040/main.cpp libraries/LowPower/src/LowPower.cpp
        build stock-host-plain     $HP "$S/HostPlain"     fail
        build stock-host-lowpower  $HP "$S/HostDormant"   fail
        build stock-device-lowpower $DV "$S/DeviceDormant" pass
        # 2. stdio_flush fix only
        git checkout HEAD -- cores/rp2040/main.cpp
        build stdio-host-plain     $HP "$S/HostPlain"     pass
        build stdio-host-lowpower  $HP "$S/HostDormant"   fail
        # 3. both fixes
        git checkout HEAD -- libraries/LowPower/src/LowPower.cpp
        build fixed-host-plain     $HP "$S/HostPlain"     pass
        build fixed-host-lowpower  $HP "$S/HostDormant"   pass
        build fixed-device-lowpower $DV "$S/DeviceDormant" pass
        build fixed-host-lowpower-rp2040 $HP2040 "$S/HostDormant" pass
        build fixed-host-lowpower-picow pico:rp2040:rpipicow:usbstack=tinyusb_host "$S/HostDormant" pass
        build fixed-device-lowpower-picow pico:rp2040:rpipicow:usbstack=tinyusb "$S/DeviceDormant" pass
        build fixed-feather-piohost-lowpower pico:rp2040:adafruit_feather_usb_host:usbstack=tinyusb,freq=120 "$S/FeatherPioHostDormant" pass
        git status --short
        echo "================ SUMMARY"
        cat out/summary.txt
    - uses: actions/upload-artifact@v7
      with:
        name: hil-lowpower-builds
        path: out/
