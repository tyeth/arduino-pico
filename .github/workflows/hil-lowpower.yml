# Throwaway test workflow (fork only, branch hil/lowpower-tinyusb-test): builds the
# Adafruit TinyUSB host/device + LowPower test sketches against stock 6.4.0 and the fixes.
name: HIL LowPower TinyUSB builds

on:
  push:
    branches: [hil/lowpower-tinyusb-test, hil/dormant-hang-debug]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Init pico-sdk submodules
      run: |
        cd pico-sdk
        git submodule update --init
    - name: Get toolchain
      run: |
        cd tools
        python3 get.py
    - uses: arduino/setup-arduino-cli@v2
    - name: Link core into sketchbook
      run: |
        mkdir -p ~/Arduino/hardware/pico
        ln -s "$GITHUB_WORKSPACE" ~/Arduino/hardware/pico/rp2040
        arduino-cli core list
        arduino-cli board listall | grep -i -E "rpipico2w|rpipico\b" | head
        arduino-cli lib install "Pico PIO USB"
    - name: Build matrix
      run: |
        set -u
        STOCK=4a79653   # tag 6.4.0
        ADA_FIX=762f25af2f0b1a7feb8a7afaa03b864b7c1a01ed   # Adafruit_TinyUSB_Arduino: TinyUSB core with rp2usb_deinit + osal_spin_deinit
        ADA_MASTER=eba909e3c59240905d3b089efb2b30a49213ca34
        WRAP="-Wl,--wrap=tud_deinit,--wrap=tud_rhport_init,--wrap=panic"
        mkdir -p out
        : > out/summary.txt
        build() {
          local name=$1 fqbn=$2 sketch=$3 elf=${4:-}
          local bp=/tmp/build-$name
          mkdir -p out/$name
          set +e
          arduino-cli compile --fqbn "$fqbn" --build-path "$bp" --build-property "compiler.c.elf.extra_flags=$elf" "$sketch" > out/$name/build.log 2>&1
          local rc=$?
          set -e
          cp "$bp"/*.elf "$bp"/*.uf2 "$bp"/*.map out/$name/ 2>/dev/null || true
          local size=$(grep -oE "(Sketch uses [0-9]+ bytes|Global variables use [0-9]+ bytes)" out/$name/build.log | grep -oE "[0-9]+" | tr '\n' '/' )
          echo "$name rc=$rc flash/ram=$size tinyusb=$(git -C libraries/Adafruit_TinyUSB_Arduino rev-parse --short HEAD)" | tee -a out/summary.txt
          tail -25 out/$name/build.log
        }
        S=tests/hil-lowpower
        PW=pico:rp2040:rpipicow
        P2=pico:rp2040:rpipico2w
        # stock 6.4.0 core + LowPower, Adafruit TinyUSB 3.7.7 (08c7dab)
        git checkout $STOCK -- cores/rp2040/main.cpp libraries/LowPower/src/LowPower.cpp
        build trace-ada-picow   $PW:usbstack=tinyusb  "$S/DeviceDormantTrace" "$WRAP"
        build trace-ada-pico2w  $P2:usbstack=tinyusb  "$S/DeviceDormantTrace" "$WRAP"
        build trace-sdk-picow   $PW                   "$S/DeviceDormantTrace" "$WRAP"
        build trace-sdk-pico2w  $P2                   "$S/DeviceDormantTrace" "$WRAP"
        # Adafruit TinyUSB with the spin lock leak fixed
        for rev in $ADA_FIX $ADA_MASTER; do
          git -C libraries/Adafruit_TinyUSB_Arduino fetch -q origin $rev
          git -C libraries/Adafruit_TinyUSB_Arduino checkout -q $rev
          tag=$([ $rev = $ADA_FIX ] && echo fix || echo master)
          build trace-$tag-picow   $PW:usbstack=tinyusb  "$S/DeviceDormantTrace" "$WRAP"
          build trace-$tag-pico2w  $P2:usbstack=tinyusb  "$S/DeviceDormantTrace" "$WRAP"
          build quiet-$tag-picow   $PW:usbstack=tinyusb  "$S/DeviceDormantQuiet"
          build quiet-$tag-pico2w  $P2:usbstack=tinyusb  "$S/DeviceDormantQuiet"
        done
        git status --short
        echo "================ SUMMARY"
        cat out/summary.txt
    - uses: actions/upload-artifact@v7
      with:
        name: hil-lowpower-trace-builds
        path: out/
