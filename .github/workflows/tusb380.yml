# Throwaway test workflow (fork only, branch hil/tinyusb-380-matrix): link matrix for Adafruit TinyUSB
# 3.8.0 (adafruit/Adafruit_TinyUSB_Arduino master 23e8953) against three arduino-pico cores:
#   a = stock 6.4.0 (4a79653), b = stdio_flush fix (5cc2a3b), c = stdio_flush fix + LowPower stubs (88efd02),
#   d = branch tinyusb-380-core-fixes as pushed (a + b + bundled library bumped to the 3.8.0 tag), its own submodule pointer
#   e = d + rp2040 port CFG_TUH_ENUMERATION_BUFSIZE 256 -> 1024 (experiment: large composite devices fail enumeration)
#   u = upstream a88e436 (earlephilhower/arduino-pico#3639 host guard) + library 3.8.0, without the stdio refinement or stubs
#   f = d + tests/tusb380/patches/fix_msc_host.py (MSC host: fail-complete instead of TU_ASSERT, wait_for_io timeout, csw status)
#   g = f + tests/tusb380/patches/fix_enum.py (SET_CONFIGURATION STALL re-enumerates; MSC set_config chain bounded and always completes)
#   h = g + tests/tusb380/patches/fix_enum_backoff.py (enumeration retries wait CFG_TUH_ENUM_RETRY_DELAY_MS = 1 s)
name: TinyUSB 3.8.0 link matrix

on:
  push:
    branches: [hil/tinyusb-380-matrix]
  workflow_dispatch:
    inputs:
      cores:
        description: 'JSON list of core variants to build'
        default: '["a","b","c","d","e"]'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(inputs.cores || '["a","b","c","d"]') }}
        target: [picow, pico2w, feather]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Init pico-sdk submodules
      run: |
        cd pico-sdk
        git submodule update --init
    - name: Adafruit_TinyUSB_Arduino -> 23e8953 (3.8.0), or the pointer of tinyusb-380-core-fixes for core d
      run: |
        SHA=23e8953f403c296127c5a57d798159468a9f1e57
        if [ "${{ matrix.core }}" = d ] || [ "${{ matrix.core }}" = e ] || [ "${{ matrix.core }}" = f ] || [ "${{ matrix.core }}" = g ] || [ "${{ matrix.core }}" = h ] || [ "${{ matrix.core }}" = u ]; then
          git fetch origin tinyusb-380-core-fixes
          SHA=$(git rev-parse FETCH_HEAD:libraries/Adafruit_TinyUSB_Arduino)
          echo "core-fix branch $(git rev-parse --short FETCH_HEAD) pins Adafruit_TinyUSB_Arduino $SHA"
        fi
        cd libraries/Adafruit_TinyUSB_Arduino
        git fetch origin $SHA
        git checkout --detach $SHA
        git log -1 --oneline
        grep version= library.properties
    - name: Core variant ${{ matrix.core }}
      run: |
        case "${{ matrix.core }}" in
          a) git checkout 4a79653 -- cores/rp2040/main.cpp libraries/LowPower/src/LowPower.cpp ;;
          b) git checkout 5cc2a3b -- cores/rp2040/main.cpp
             git checkout 4a79653 -- libraries/LowPower/src/LowPower.cpp ;;
          c) : ;;
          e) git fetch origin tinyusb-380-core-fixes
             git checkout FETCH_HEAD -- cores libraries/LowPower
             f=libraries/Adafruit_TinyUSB_Arduino/src/arduino/ports/rp2040/tusb_config_rp2040.h
             sed -i 's/^#define CFG_TUH_ENUMERATION_BUFSIZE 256$/#define CFG_TUH_ENUMERATION_BUFSIZE 1024/' $f
             grep -n "CFG_TUH_ENUMERATION_BUFSIZE" $f ;;
          u) git fetch origin tinyusb-380-core-fixes
             git checkout FETCH_HEAD~3 -- cores libraries/LowPower
             git log -1 --oneline FETCH_HEAD~3
             grep -n -A2 "USE_TINYUSB_HOST" cores/rp2040/main.cpp | head -4 ;;
          f) git fetch origin tinyusb-380-core-fixes
             git checkout FETCH_HEAD -- cores libraries/LowPower
             python3 tests/tusb380/patches/fix_msc_host.py libraries/Adafruit_TinyUSB_Arduino
             git -C libraries/Adafruit_TinyUSB_Arduino diff --stat ;;
          g) git fetch origin tinyusb-380-core-fixes
             git checkout FETCH_HEAD -- cores libraries/LowPower
             python3 tests/tusb380/patches/fix_msc_host.py libraries/Adafruit_TinyUSB_Arduino
             python3 tests/tusb380/patches/fix_enum.py libraries/Adafruit_TinyUSB_Arduino
             git -C libraries/Adafruit_TinyUSB_Arduino diff --stat ;;
          h) git fetch origin tinyusb-380-core-fixes
             git checkout FETCH_HEAD -- cores libraries/LowPower
             python3 tests/tusb380/patches/fix_msc_host.py libraries/Adafruit_TinyUSB_Arduino
             python3 tests/tusb380/patches/fix_enum.py libraries/Adafruit_TinyUSB_Arduino
             python3 tests/tusb380/patches/fix_enum_backoff.py libraries/Adafruit_TinyUSB_Arduino
             git -C libraries/Adafruit_TinyUSB_Arduino diff --stat ;;
          d) git checkout FETCH_HEAD -- cores libraries/LowPower 2>/dev/null || { git fetch origin tinyusb-380-core-fixes; git checkout FETCH_HEAD -- cores libraries/LowPower; }
             git fetch origin tinyusb-380-core-fixes
             echo "diff of cores/ and libraries/LowPower vs the core-fix branch (expect empty):"
             git diff --stat FETCH_HEAD -- cores libraries/LowPower ;;
        esac
        git status --short cores libraries/LowPower
        git diff --stat HEAD -- cores libraries/LowPower
    - name: Get toolchain
      run: |
        cd tools
        python3 get.py
    - uses: arduino/setup-arduino-cli@v2
    - name: Link core into sketchbook, install libraries without dependencies
      run: |
        mkdir -p ~/Arduino/hardware/pico
        ln -s "$GITHUB_WORKSPACE" ~/Arduino/hardware/pico/rp2040
        arduino-cli core list
        arduino-cli lib install --no-deps "Pico PIO USB"
        arduino-cli lib install --no-deps "SdFat - Adafruit Fork"
        arduino-cli lib list
        if ls ~/Arduino/libraries | grep -i tinyusb; then echo "::error::a TinyUSB library got installed into the sketchbook"; exit 1; fi
    - name: Build
      run: |
        set -u
        mkdir -p out
        : > out/summary.txt
        CORE=${{ matrix.core }}
        build() {
          local name=$1 fqbn=$2 sketch=$3 xf=${4:-}
          local bp=/tmp/build-$name
          local props=()
          if [ -n "$xf" ]; then props=(--build-property "compiler.c.extra_flags=$xf" --build-property "compiler.cpp.extra_flags=$xf"); fi
          mkdir -p out/$name
          set +e
          arduino-cli compile -v --fqbn "$fqbn" --build-path "$bp" "${props[@]}" "$sketch" > out/$name/build.log 2>&1
          local rc=$?
          set -e
          cp "$bp"/*.elf "$bp"/*.uf2 "$bp"/*.map out/$name/ 2>/dev/null || true
          local tusb=$(grep -m1 -oE "Using library Adafruit TinyUSB Library at version [^ ]+ in folder: [^ ]+" out/$name/build.log | sed -E 's/Using library Adafruit TinyUSB Library at version ([^ ]+) in folder: (.*)/\1@\2/')
          [ -n "$tusb" ] || tusb="none"
          local dup=$(grep -c "multiple definition" out/$name/build.log || true)
          local undef=$(grep -c "undefined reference" out/$name/build.log || true)
          local pulled="-"
          if ls "$bp"/*.map >/dev/null 2>&1; then
            pulled=$(grep -oE "libpico\.a\((usbd|tusb|tusb_fifo|cdc_device)\.c\.o\)" "$bp"/*.map | sort -u | sed 's/libpico.a(//;s/.c.o)//' | tr '\n' ',' )
            [ -n "$pulled" ] || pulled="none"
          fi
          local size=$(grep -oE "(Sketch uses [0-9]+ bytes|Global variables use [0-9]+ bytes)" out/$name/build.log | grep -oE "[0-9]+" | tr '\n' '/')
          echo "core=$CORE $name rc=$rc tinyusb=$tusb dup=$dup undef=$undef libpico_tusb=[$pulled] flash/ram=$size" | tee -a out/summary.txt
          if [ $rc -ne 0 ]; then grep -E "error|multiple definition|undefined reference" out/$name/build.log | head -8; fi
        }
        S=tests/tusb380
        L=libraries/Adafruit_TinyUSB_Arduino/examples
        case "${{ matrix.target }}" in
          picow|pico2w)
            B=pico:rp2040:rpi${{ matrix.target }}
            for st in tinyusb tinyusb_host picosdk nousb; do
              build ${{ matrix.target }}-$st-Plain "$B:usbstack=$st" $S/Plain
              build ${{ matrix.target }}-$st-LP "$B:usbstack=$st" $S/LP
            done
            for st in tinyusb tinyusb_host; do
              build ${{ matrix.target }}-$st-LPWiFi "$B:usbstack=$st" $S/LPWiFi
              build ${{ matrix.target }}-$st-HwCycles "$B:usbstack=$st" $S/HwCycles
            done
            build ${{ matrix.target }}-tinyusb_host-host_device_info "$B:usbstack=tinyusb_host" $L/Host/Simple/host_device_info
            ;;
          feather)
            B=pico:rp2040:adafruit_feather_usb_host
            for st in tinyusb tinyusb_host picosdk nousb; do
              build feather-$st-Plain "$B:usbstack=$st,freq=120" $S/Plain
              build feather-$st-LP "$B:usbstack=$st,freq=120" $S/LP
            done
            build feather-tinyusb-msc_file_explorer "$B:usbstack=tinyusb,freq=120" $L/DualRole/MassStorage/msc_file_explorer
            build feather-tinyusb-FeatherMsc "$B:usbstack=tinyusb,freq=120" $S/FeatherMsc
            build feather-tinyusb-FeatherMscDiag "$B:usbstack=tinyusb,freq=120" $S/FeatherMscDiag
            build feather-tinyusb-HostWatch "$B:usbstack=tinyusb,freq=120" $S/HostWatch
            build feather-tinyusb-FeatherMscFix "$B:usbstack=tinyusb,freq=120" $S/FeatherMscFix
            DBG="-DCFG_TUSB_DEBUG=2 -DCFG_TUD_LOG_LEVEL=3 -DCFG_TUSB_DEBUG_PRINTF=hil_tusb_printf -DSERIAL_TUSB_DEBUG=hilLog -include $GITHUB_WORKSPACE/$S/FeatherMscFixDbg/hil_log.h"
            build feather-tinyusb-FeatherMscFixDbg "$B:usbstack=tinyusb,freq=120" $S/FeatherMscFixDbg "$DBG"
            build feather-tinyusb-FeatherReenumAB "$B:usbstack=tinyusb,freq=120" $S/FeatherReenumAB "${DBG/FeatherMscFixDbg/FeatherReenumAB}"
            build feather-tinyusb-FeatherReenumAB-nodebug "$B:usbstack=tinyusb,freq=120" $S/FeatherReenumAB
            build feather-tinyusb-FeatherMscWake "$B:usbstack=tinyusb,freq=120" $S/FeatherMscWake "${DBG/FeatherMscFixDbg/FeatherMscWake}"
            build feather-tinyusb_host-host_device_info "$B:usbstack=tinyusb_host,freq=120" $L/Host/Simple/host_device_info
            ;;
        esac
        echo "================ SUMMARY"
        cat out/summary.txt
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: tusb380-${{ matrix.core }}-${{ matrix.target }}
        path: out/
